name: CI — FastAPI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t flight-segmentation-fastapi -f Dockerfile.fastapi .

      - name: Run FastAPI container
        run: |
          docker run -d \
            -p 8000:8000 \
            --name fastapi-api \
            flight-segmentation-fastapi
          sleep 15

      - name: Install test dependencies
        run: pip install requests

      - name: Run API test
        run: python test_fastapi.py

      - name: Stop container
        if: always()
        run: docker stop fastapi-api && docker rm fastapi-api






